rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: Unreachable routers are only logged at debug level.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Platforms are unit-tested with stub coordinators; full setup coverage is partial.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: All diagnostic sensors are enabled by default.
  entity-translations: done
  exception-translations:
    status: todo
    comment: Action errors are raised with plain English messages.
  icon-translations:
    status: todo
    comment: Icons are still set on the entity descriptions instead of icons.json.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One config entry is one router; removing the entry removes the device. Client trackers are entities, not devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: The integration is not yet checked with mypy strict.
